<head>

<title>Painel Diagnóstico da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,300,100,1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap">
<style>
/* Painel do escritório · Paleta Amora & Floresta */
:root {
  --bg: #F6F4F1; --surface: #FBFAF8; --line: rgba(62,38,32,.16); --fg: #3E2620; --muted: rgba(62,38,32,.72);
  --accent: #8A1538; --accent-fg: #F6F4F1; --accent-soft: #F0DEDD; --taupe: rgba(62,38,32,.45); --selo-fundo: #E3EAE1; --floresta: #2E5530;
  --warn: #8A1538; --warn-soft: #F0DEDD; --trilho: #EDE6E2;
  --f-display: "Playfair Display", "Didot", Georgia, serif;
  --f-body: "Poppins", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --f-marca: "Fraunces", "Playfair Display", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 300 1rem/1.65 var(--f-body);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
b, strong { font-weight: 600; }
a { color: var(--accent); }
h1, h2 { font-family: var(--f-display); font-weight: 400; font-style: italic; line-height: 1.15; margin: 0 0 14px; text-wrap: balance; }
h1 { font-size: clamp(2rem, 7vw, 2.6rem); }
h2 { font-size: clamp(1.5rem, 5.4vw, 1.9rem); }
h1:focus, h2:focus { outline: none; }
p { margin: 0 0 12px; }

.eyebrow {
  font-family: var(--f-body); font-weight: 600; font-size: .78rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}
.lede { font-size: 1.12rem; color: var(--muted); }
.dica { color: var(--muted); font-size: .9rem; }
.assinatura { font-family: var(--f-display); font-size: 1.25rem; color: var(--fg); margin-top: 28px; }
.rodape { color: var(--muted); font-size: .85rem; margin-top: -6px; }
.aviso { background: var(--accent-soft); padding: 10px 14px; border-radius: 4px; font-size: .9rem; margin-top: 18px; }
.erro { color: var(--warn); font-size: .92rem; min-height: 1.4em; margin: 8px 0 0; font-weight: 400; }

/* Topo */
.topo {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.marca { font-family: var(--f-display); font-weight: 500; color: var(--fg); font-size: 1.35rem; letter-spacing: .02em; display: block; max-width: 640px; margin: 0 auto 8px; }
.trilho { height: 2px; background: var(--line); max-width: 640px; margin: 0 auto; }
.trilho span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

.pagina {
  max-width: 640px; margin: 0 auto;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
}

/* Campos */
label.campo, label.sub { display: block; margin: 0 0 18px; font-weight: 400; }
label.campo small, label.sub small { color: var(--muted); font-weight: 300; }
label.sub { margin: 10px 0 0; font-size: .9rem; }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], input:not([type]), select, textarea {
  display: block; width: 100%; margin-top: 6px; font: 400 1rem var(--f-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; min-height: 48px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
fieldset { border: 0; padding: 0; margin: 0 0 26px; min-width: 0; }
legend { font-weight: 500; margin-bottom: 10px; padding: 0; }

.senha { margin-top: 24px; }
.senha label { font-weight: 500; }
.senha input { font-size: 1.4rem; letter-spacing: .18em; text-transform: uppercase; text-align: center; font-weight: 500; }
.senha .btn { width: 100%; margin-top: 12px; }
.ajuda { margin-top: 26px; color: var(--muted); font-size: .92rem; }

/* Escolhas de um toque */
.escolhas { display: grid; gap: 8px; }
.escolha {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  font: 400 .98rem/1.4 var(--f-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 13px 16px; min-height: 52px; cursor: pointer;
}
.escolha::before {
  content: ""; flex: none; width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--taupe); background: var(--surface);
}
.escolha.multi::before { border-radius: 3px; }
.escolha[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 500; }
.escolha[aria-pressed=true]::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.escolha:disabled { opacity: .45; cursor: not-allowed; }
.escolha small { display: block; color: var(--muted); font-size: .82rem; }

.detalhes { margin-top: 16px; display: grid; gap: 10px; }
.detalhe { background: var(--surface); border: 1px dashed var(--taupe); border-radius: 6px; padding: 12px 14px; }
.detalhe-titulo { font-size: .9rem; margin: 0; font-weight: 400; }

.consentimento { display: flex; gap: 12px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.consentimento input { flex: none; width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); }

/* Botões */
.btn {
  display: inline-flex; justify-content: center; align-items: center; gap: 8px;
  font: 500 .95rem var(--f-body); letter-spacing: .03em; text-decoration: none;
  background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent);
  border-radius: 999px; padding: 12px 26px; min-height: 48px; cursor: pointer;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.sec-btn, .btn.sec-btn { background: transparent; color: var(--accent); }
.voltar { font: 400 .95rem var(--f-body); background: none; border: 0; color: var(--muted); padding: 12px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }

/* Resultado */
.estado { background: var(--accent-soft); border: 0; border-left: 4px solid var(--accent); border-radius: 4px; padding: 18px 20px; margin: 22px 0 8px; }
.estado-atencao { border-left-color: var(--taupe); }
.estado-cuidado { border-left-color: var(--warn); }
.estado-nome { font-family: var(--f-display); font-size: 1.7rem; font-style: italic; margin-bottom: 6px; }
h2.sec { margin-top: 34px; }
.ranking { list-style: none; padding: 0; margin: 0; counter-reset: rk; display: grid; gap: 12px; }
.ranking li { counter-increment: rk; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; font-size: .93rem; }
.ranking li p { margin: 6px 0 0; }
.rk-cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.rk-nome { font-family: var(--f-display); font-size: 1.3rem; }
.rk-nome::before { content: counter(rk) ". "; color: var(--muted); }
.selo { font-family: var(--f-body); font-weight: 600; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--selo-fundo); }
.q1 .selo, .q2 .selo { background: var(--accent-soft); }
.passo { background: var(--accent-soft); border-radius: 4px; padding: 18px 20px; margin-top: 26px; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

@media print {
  .topo, .nao-imprimir { display: none !important; }
  body { background: #fff; color: #000; }
  .pagina { padding-top: 0; }
  .ranking li { break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) { .trilho span { transition: none; } }

/* Saúde da casa (como no quadro da família) */
:root { --saude-boa: #2E5530; --saude-media: #A9746A; --saude-baixa: #8A1538; }
.saude { margin: 22px 0 18px; }
.saude-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.saude-cab h2 { margin: 0; }
.saude-nota { margin: 0; font-size: .95rem; color: var(--muted); }
.saude-nota b { font: 500 2rem var(--f-display); color: var(--fg); }
.saude-nota.boa b { color: var(--saude-boa); }
.saude-nota.media b { color: #A9746A; }
.saude-nota.baixa b { color: var(--saude-baixa); }
.saude .dica { margin: 2px 0 12px; }
.saude-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.comodo { display: flex; flex-direction: column; gap: 7px; min-width: 0; text-decoration: none; color: var(--fg);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
.comodo:hover { border-color: var(--taupe); }
.comodo-nome { font-weight: 500; font-size: .9rem; overflow-wrap: anywhere; }
.comodo-barra { height: 8px; border-radius: 9px; background: var(--trilho); overflow: hidden; }
.comodo-barra span { display: block; height: 100%; border-radius: 9px; }
.comodo.boa .comodo-barra span { background: var(--saude-boa); }
.comodo.media .comodo-barra span { background: var(--saude-media); }
.comodo.baixa .comodo-barra span { background: var(--saude-baixa); }
.comodo small { color: var(--muted); font-size: .75rem; }
.comodo.baixa small { color: var(--saude-baixa); font-weight: 500; }
.ranking li { scroll-margin-top: 80px; }
.ranking li:target { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* Convite final */
.convite { background: var(--accent-soft); border-radius: 4px; padding: 22px 20px; margin-top: 28px; }
.convite-abre { font: italic 400 1.35rem/1.35 var(--f-display); margin-bottom: 12px; }
.convite .passo-titulo { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.convite .assinatura { margin-top: 18px; }
@media (min-width: 560px) { .saude-grade { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pagina.larga { max-width: 980px; }
.topo-admin {
  position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.topo-admin .marca { margin: 0; }
.abas { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.abas button { font: 400 .88rem var(--f-body); border: 0; background: transparent; color: var(--fg); padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.abas button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); }
.abas .cont { font-size: .75rem; margin-left: 4px; }
#sair { margin-left: auto; }

.login { max-width: 420px; margin: 40px auto; }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; margin-bottom: 16px; min-width: 0; }
.cartao h2 { font-size: 1.45rem; }
.grade2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.linha-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 14px; }
.linha-form label { margin-bottom: 12px; font-size: .9rem; font-weight: 400; display: block; }

.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.filtros button { font: 400 .85rem var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.filtros button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }

.lista { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; font: inherit; color: inherit; cursor: pointer; }
.item:hover { border-color: var(--taupe); }
.item .nome { font-weight: 500; }
.item .meta { color: var(--muted); font-size: .85rem; }
.item .dir { text-align: right; display: grid; gap: 4px; justify-items: end; }
.pilula { font-family: var(--f-body); font-weight: 600; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--selo-fundo); white-space: nowrap; }
.pilula.novo { background: var(--warn-soft); color: var(--warn); }
.pilula.ok { background: var(--accent-soft); }
.vazio { color: var(--muted); padding: 30px 0; text-align: center; }

.mensagem { white-space: pre-wrap; font: 300 .92rem/1.6 var(--f-body); background: var(--bg); border: 1px dashed var(--taupe); border-radius: 4px; padding: 14px 16px; margin: 12px 0; }
.codigo-grande { font: 500 2rem var(--f-body); letter-spacing: .2em; color: var(--accent); }

table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.tabela { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-body); font-weight: 600; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td .mini { font: 400 .8rem var(--f-body); border: 1px solid var(--line); background: transparent; color: var(--accent); border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.inativa td { color: var(--muted); }

.det-cab { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.det-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.det-acoes .btn { min-height: 40px; padding: 8px 18px; font-size: .88rem; }
.pontos { color: var(--muted); font-size: .82rem; margin-top: 6px; }
dl.resp { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: .9rem; }
dl.resp dt { color: var(--muted); }
dl.resp dd { margin: 0; }
.nota-interna { background: var(--warn-soft); border-radius: 4px; padding: 12px 14px; font-size: .9rem; margin-top: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0;
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 720px) {
  .grade2 { grid-template-columns: 1fr; }
  dl.resp { grid-template-columns: 1fr; gap: 2px; }
  dl.resp dd { margin-bottom: 8px; }
  .item { grid-template-columns: 1fr; }
  .item .dir { justify-items: start; text-align: left; grid-auto-flow: column; justify-content: start; gap: 8px; }
}

/* Público */
.barras { display: grid; gap: 12px; margin-top: 6px; }
.barra-linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: .88rem; }
.barra-n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.barra { grid-column: 1 / -1; height: 8px; border-radius: 9px; background: var(--trilho); overflow: hidden; }
.barra span { display: block; height: 100%; border-radius: 9px; background: var(--accent); }
.codigo-grande small { font-size: 1rem; color: var(--muted); letter-spacing: 0; }

.marca { color: var(--fg); }
.marca .logo { display: block; width: 40px; height: auto; overflow: visible; }
.eyebrow, th, .pilula, .selo { font-weight: 500; letter-spacing: .24em; }
.selo, .pilula { color: var(--floresta); }
.pilula.novo { color: var(--warn); }
h1, h2 { font-style: normal; }
@media (max-width: 720px) { .item .dir { display: flex; flex-wrap: wrap; } .pilula { white-space: normal; } .topo-admin { gap: 10px; } }
.pagina { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
</style>
</head>
